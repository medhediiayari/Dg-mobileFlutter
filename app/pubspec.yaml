name: dgflow_rc
description: "DG Flow RC — validation des RC et avenants (Flutter)."
publish_to: 'none'

# Version comparée à /meta.versionMinimaleApp au démarrage.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  flutter_appauth: ^12.1.0
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-dgflow.png
    - assets/images/logo-dgflow-dark.png
    - assets/images/splash-icon.png
    # Page de connexion du web (dgflow/public).
    - assets/images/dg-group-logo.png
    - assets/images/dg-office-background.jpg

  # Polices du web DG Flow (app/globals.css) : IBM Plex Sans pour tout le texte,
  # IBM Plex Mono pour les références et montants en chasse fixe.
  # SIL Open Font License, assets/fonts/IBM-Plex-OFL.txt.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
